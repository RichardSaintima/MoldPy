[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moldpy"
version = "0.2.0" # O 0.2.0 si agregan muchas funciones nuevas
description = "Generador de plantillas y estructuras de proyectos en Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "inquirer>=3.1.0"
]

[project.scripts]
moldpy = "mi_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]